version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /proxy
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /tui
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /proxy
      - /v3-service
      - /sandbox
      - /geometric-lens
      - /inference
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    # Base-image majors are deliberate migrations, not routine bumps:
    # a CUDA major must match the host driver ceiling and rebuild the
    # llama image against the pinned llama.cpp patches, and a Python
    # major moves the lens/sandbox interpreter under pinned torch
    # wheels. Digest and minor/patch updates still flow.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Docker tags aren't semver: the python interpreter version rides
      # the MINOR component (3.11 -> 3.14), and moving it is the same
      # deliberate migration as a major (pinned torch wheels, lens/
      # sandbox interpreter). Patch + digest updates still flow.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
